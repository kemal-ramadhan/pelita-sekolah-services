services:
  db_auth:
    image: postgres:15
    container_name: db_auth
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-edupilot_auth_db}
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    networks:
      - edupilot_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: edupilot-auth-service-redis
    networks:
      - edupilot_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  edupilot-auth-service:
    build: .
    container_name: edupilot-auth-service
    env_file:
      - .env
    depends_on:
      db_auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - edupilot_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${APP_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: on-failure
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.customer.rule=PathPrefix(`/customer`)"
      - "traefik.http.services.auth.loadbalancer.server.port=8080"

networks:
  edupilot_net:
    external: true
