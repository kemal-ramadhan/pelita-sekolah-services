# Standalone stack for developing this service in isolation.
# The full platform (gateway + auth + instantion) lives in ../docker-compose.yml,
# where this service is reached only through the gateway.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: edupilot_instantion_db
    volumes:
      - instantion-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7

  edupilot-instantion-service:
    build: .
    restart: on-failure
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    # Bound to localhost only, for local testing without the gateway.
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  instantion-pgdata:
